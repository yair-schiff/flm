name: flm
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ninja
  - packaging
  - setuptools
  - wheel
  - cuda-nvcc=12.4.99
  - pip:
      - torch>=2.3.0
      - datasets==3.6.0
      - einops==0.8.1
      - entmax==1.3
      - filelock==3.25.2
      - fsspec==2025.3.0
      - huggingface_hub==0.36.0
      - hf_transfer==0.1.9
      - hydra-core==1.3.2
      - lightning==2.6.0
      - numpy==2.3.2
      - omegaconf==2.3.0
      - Requests==2.32.4
      - rich==14.2.0
      - scipy==1.16.3
      - timm==1.0.22
      - tokenizers==0.22.1
      - torchmetrics==1.8.2
      - tqdm==4.67.1
      - transformers==4.57.3
      - triton==3.4.0
      - wandb==0.23.1
      - nvitop==1.3.2

